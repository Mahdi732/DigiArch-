version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: digiarch-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: digiarch-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-mc:
    image: minio/mc:RELEASE.2024-06-13T22-53-53Z
    container_name: digiarch-minio-mc
    depends_on:
      - minio
    entrypoint: |
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      /usr/bin/mc mb -p local/${MINIO_BUCKET:-ged-documents};
      /usr/bin/mc anonymous set download local/${MINIO_BUCKET:-ged-documents};
      tail -f /dev/null"

  backend:
    build: ./backend
    container_name: digiarch-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/digiarch}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-ged-documents}
      - API_PORT=${API_PORT:-3000}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ARCHIVING_MANAGER_NAME=${ARCHIVING_MANAGER_NAME:-automation-bot}
    ports:
      - "3000:3000"
    depends_on:
      - mongo
      - minio

  frontend:
    build: ./frontend
    container_name: digiarch-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
  minio_data:
