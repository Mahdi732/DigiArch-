name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (workspaces)
        run: npm install --workspaces

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/api
        run: npm run build

      - name: Backend Docker build
        run: docker build -q ./backend -t digiarch-backend:ci

      - name: Frontend Docker build
        run: docker build -q ./frontend -t digiarch-frontend:ci
